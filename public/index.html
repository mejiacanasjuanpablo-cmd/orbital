<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07090c">
<meta name="mobile-web-app-capable" content="yes">
<title>Panel USB</title>
<style>
  :root {
    --bg: #07090c; --tile: #10141a; --tile-2: #161b23; --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12);
    --text: #eef1f6; --muted: #7d8696; --dim: #4b5363;
    --teal: #2dd4bf; --green: #4ade80; --violet: #a78bfa; --orange: #fb923c; --pink: #f472b6; --red: #f87171; --sky: #38bdf8;
    --r: 18px; --gap: clamp(6px, 1.4vmin, 12px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; }
  body { background: radial-gradient(120vmax 80vmax at 80% -20%, rgba(45,212,191,.07), transparent 60%), var(--bg); }
  button { font: inherit; color: inherit; }
  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Páginas deslizables */
  #pages { position: fixed; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
           scrollbar-width: none; overscroll-behavior: contain; }
  #pages::-webkit-scrollbar { display: none; }
  .page { flex: 0 0 100%; height: 100%; scroll-snap-align: start; padding: max(var(--gap), env(safe-area-inset-top)) max(var(--gap), env(safe-area-inset-right)) calc(var(--gap) + 18px) max(var(--gap), env(safe-area-inset-left));
          display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr)); gap: var(--gap); }
  #dots { position: fixed; left: 50%; bottom: max(5px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 6px; z-index: 5; }
  #dots button { width: 6px; height: 6px; padding: 0; border: 0; border-radius: 99px; background: var(--dim); transition: width .25s, background .25s; cursor: pointer; }
  #dots button.on { width: 18px; background: var(--text); }

  .tile { background: linear-gradient(180deg, rgba(255,255,255,.025), transparent 40%), var(--tile); border: 1px solid var(--line);
          border-radius: var(--r); padding: clamp(10px, 2vmin, 16px); position: relative; overflow: hidden; min-width: 0; min-height: 0; }
  .cap { font-size: clamp(9px, 1.5vmin, 11px); font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }

  /* ---------- Página 1 */
  .clock { grid-column: 1 / 7; grid-row: 1 / 5; display: flex; flex-direction: column; }
  .strip { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: clamp(9px, 1.6vmin, 12px); white-space: nowrap; overflow: hidden; }
  .strip .sep { color: var(--dim); }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex: none; }
  .live.on { background: var(--green); box-shadow: 0 0 0 3px rgba(74,222,128,.15); }
  .time { margin-top: auto; display: flex; align-items: flex-start; font-weight: 200; letter-spacing: -.04em; line-height: .9;
          font-size: clamp(48px, 21vmin, 150px); font-variant-numeric: tabular-nums; }
  .time .colon { opacity: .55; margin: 0 .02em; animation: blink 2s steps(1) infinite; }
  .time sup { font-size: .22em; font-weight: 400; letter-spacing: 0; color: var(--muted); margin: .25em 0 0 .3em; }
  @keyframes blink { 50% { opacity: .2; } }
  .date { font-size: clamp(12px, 2.6vmin, 18px); margin-top: .5em; }
  .meta { display: flex; gap: 14px; margin-top: .6em; color: var(--muted); font-size: clamp(10px, 1.8vmin, 13px); flex-wrap: wrap; }
  .meta b { color: var(--text); font-weight: 600; }

  .media { grid-column: 7 / 13; grid-row: 1 / 5; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr auto auto; column-gap: clamp(10px, 2vmin, 16px); }
  .art { grid-row: 1 / 3; width: clamp(56px, 22vmin, 140px); aspect-ratio: 1; border-radius: 12px; background: var(--tile-2) center/cover no-repeat;
         display: grid; place-items: center; color: var(--dim); font-size: clamp(24px, 8vmin, 48px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .art.has { color: transparent; }
  .track { align-self: start; min-width: 0; }
  .track .cap { color: var(--pink); }
  .track .t { font-size: clamp(13px, 3vmin, 20px); font-weight: 650; margin-top: 4px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .track .a { color: var(--muted); font-size: clamp(10px, 2vmin, 13px); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog { grid-column: 1 / 3; margin-top: clamp(6px, 1.6vmin, 12px); }
  .bar { height: 4px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--text); transition: width .9s linear; }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .controls { grid-column: 1 / 3; display: flex; align-items: center; gap: clamp(6px, 1.5vmin, 12px); margin-top: clamp(4px, 1vmin, 8px); }
  .cbtn { width: clamp(30px, 7vmin, 44px); height: clamp(30px, 7vmin, 44px); display: grid; place-items: center; border: 0; background: none; border-radius: 50%;
          font-size: clamp(16px, 3.4vmin, 22px); cursor: pointer; color: var(--text); transition: background .15s, transform .08s; }
  .cbtn:active { transform: scale(.9); background: var(--tile-2); }
  .cbtn.main { background: var(--text); color: var(--bg); width: clamp(38px, 9vmin, 54px); height: clamp(38px, 9vmin, 54px); }
  .vol { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: 1; max-width: 46%; color: var(--muted); }
  .vol .cbtn { color: var(--muted); }
  .vol output { font-size: 11px; width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 22px; background: none; margin: 0; --p: 50%; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 99px; background: linear-gradient(90deg, var(--text) var(--p), rgba(255,255,255,.1) var(--p)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; margin-top: -5px; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 99px; background: rgba(255,255,255,.1); }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: 99px; background: var(--text); }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; }

  .stat { grid-row: 5 / 7; display: flex; flex-direction: column; }
  .stat:nth-of-type(3) { grid-column: 1 / 4; } .stat:nth-of-type(4) { grid-column: 4 / 7; }
  .stat:nth-of-type(5) { grid-column: 7 / 10; } .stat:nth-of-type(6) { grid-column: 10 / 13; }
  .stat .v { font-size: clamp(18px, 4.6vmin, 30px); font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; white-space: nowrap; }
  .stat .v small { font-size: .45em; color: var(--muted); font-weight: 500; margin-left: 2px; letter-spacing: 0; }
  .stat .s { color: var(--muted); font-size: clamp(9px, 1.6vmin, 11px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat canvas { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 45%; pointer-events: none; }

  /* ---------- Página 2 */
  .ring { grid-row: 1 / 4; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .ring:nth-of-type(1) { grid-column: 1 / 4; } .ring:nth-of-type(2) { grid-column: 4 / 7; }
  .ring:nth-of-type(3) { grid-column: 7 / 10; } .ring:nth-of-type(4) { grid-column: 10 / 13; }
  .ring .g { position: relative; height: 68%; aspect-ratio: 1; max-width: 100%; }
  .ring svg { width: 100%; height: 100%; transform: rotate(135deg); }
  .ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
  .ring .track { stroke: rgba(255,255,255,.07); }
  .ring .arc { transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); }
  .ring .n { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(16px, 5vmin, 30px); font-weight: 600; font-variant-numeric: tabular-nums; }
  .ring .n small { font-size: .45em; color: var(--muted); }
  .ring .cap { margin-top: 4px; }
  .ring .s { color: var(--muted); font-size: clamp(9px, 1.5vmin, 11px); margin-top: 1px; white-space: nowrap; }

  .deck { grid-column: 1 / 13; grid-row: 4 / 7; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: var(--gap); padding: 0; background: none; border: 0; }
  .key { display: flex; align-items: center; justify-content: center; gap: clamp(6px, 1.4vmin, 10px); border: 1px solid var(--line); background: var(--tile);
         border-radius: 14px; cursor: pointer; padding: 6px; font-size: clamp(11px, 2.2vmin, 14px); font-weight: 550; min-width: 0;
         transition: transform .08s, background .15s, border-color .2s; }
  .key svg.i { font-size: clamp(16px, 3.6vmin, 22px); color: var(--c, var(--text)); }
  .key span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .key:active { transform: scale(.95); background: var(--tile-2); }
  .key.busy { border-color: var(--c, var(--sky)); }
  .key.ok { border-color: var(--green); }
  .key.err { border-color: var(--red); }

  /* ---------- Página 3 */
  .cmds { grid-column: 1 / 6; grid-row: 1 / 7; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: var(--gap); }
  .cmds .key { flex-direction: column; gap: 6px; }
  .cmds .key svg.i { font-size: clamp(20px, 5vmin, 28px); }
  .console { grid-column: 6 / 13; grid-row: 1 / 7; display: flex; flex-direction: column; }
  .console .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .console .head .cap { color: var(--teal); }
  .console .head span:last-child { color: var(--muted); font-size: 11px; }
  .console pre { flex: 1; margin: 10px 0 0; overflow: auto; font: clamp(10px, 1.8vmin, 12px)/1.5 "Cascadia Mono", Consolas, ui-monospace, monospace;
                 color: #c9d3e3; white-space: pre; -webkit-user-select: text; user-select: text; }
  .console pre .err { color: var(--red); }
  .console pre .hint { color: var(--dim); }

  /* ---------- Vertical: apila las tarjetas y permite desplazarse */
  @media (orientation: portrait) {
    .page { grid-template-rows: none; grid-auto-rows: minmax(84px, auto); align-content: start; overflow-y: auto; }
    .clock, .media { grid-column: 1 / 13; grid-row: auto; min-height: 210px; }
    .stat { grid-row: auto; min-height: 96px; }
    .stat:nth-of-type(3), .stat:nth-of-type(5) { grid-column: 1 / 7; } .stat:nth-of-type(4), .stat:nth-of-type(6) { grid-column: 7 / 13; }
    .ring { grid-row: auto; min-height: 170px; }
    .ring:nth-of-type(1), .ring:nth-of-type(3) { grid-column: 1 / 7; } .ring:nth-of-type(2), .ring:nth-of-type(4) { grid-column: 7 / 13; }
    .ring .g { height: 110px; }
    .deck { grid-row: auto; grid-template-columns: 1fr 1fr; grid-auto-rows: 64px; }
    .cmds { grid-column: 1 / 13; grid-row: auto; grid-auto-rows: 84px; }
    .console { grid-column: 1 / 13; grid-row: auto; min-height: 280px; }
    .time { font-size: clamp(64px, 24vw, 120px); }
    .art { width: 96px; }
  }

  /* ---------- Hoja de confirmación y aviso */
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; place-items: center; z-index: 20; padding: 16px; }
  .sheet.open { display: grid; }
  .sheet .box { background: var(--tile); border: 1px solid var(--line-2); border-radius: 20px; padding: 20px; width: min(360px, 100%); }
  .sheet h3 { margin: 0 0 16px; font-size: 17px; font-weight: 600; }
  .sheet .row { display: flex; gap: 10px; }
  .sheet .row button { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--tile-2); cursor: pointer; font-weight: 600; }
  .sheet .row button.go { background: var(--text); color: var(--bg); border-color: var(--text); }
  .toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -12px); background: var(--tile-2); border: 1px solid var(--line-2); padding: 8px 14px;
           border-radius: 99px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30; max-width: calc(100% - 32px);
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" stroke="none"/><rect x="14" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 5.5v13L9 12z" fill="currentColor" stroke="none"/><path d="M6 5.5v13"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5.5v13l9-6.5z" fill="currentColor" stroke="none"/><path d="M18 5.5v13"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></symbol>
    <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3.5" y="7.5" width="17" height="12" rx="2"/><path d="M9 7.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v1.5M3.5 13h17"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.3 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.3-3.5-8.5s1-5.9 3.5-8.5"/></symbol>
    <symbol id="i-calculator" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></symbol>
    <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6.5" cy="7" r="2.5"/><circle cx="6.5" cy="17" r="2.5"/><path d="M8.6 8.4 19.5 18M8.6 15.6 19.5 6"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3.5 12h4l2.5-6 4 12 2.5-6h4"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3.5c.5 3 4.5 5 4.5 9.5a4.5 4.5 0 0 1-9 0c0-2 1-3.2 2-4 0 1.6.8 2.5 1.8 2.5C11.3 9 11 6 12 3.5z"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M3.5 9a12.5 12.5 0 0 1 17 0M6.5 12.3a8 8 0 0 1 11 0M9.5 15.5a3.6 3.6 0 0 1 5 0"/><path d="M12 19h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></symbol>

    <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/></symbol>
  </defs>
</svg>

<div id="pages">
  <!-- 1 · Inicio -->
  <section class="page" data-name="Inicio">
    <div class="tile clock">
      <div class="strip"><span class="live" id="live"></span><span id="host">PC</span><span class="sep">·</span><span>USB</span><span class="sep">·</span><span id="stripVol">–</span><span class="sep">·</span><span id="stripStatus">Conectando…</span></div>
      <div class="time"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span><sup id="ss">--</sup></div>
      <div class="date" id="date"></div>
      <div class="meta"><span>Encendido <b id="uptime">–</b></span><span id="cpuModel"></span></div>
    </div>

    <div class="tile media">
      <div class="art" id="art"><svg class="i"><use href="#i-music"/></svg></div>
      <div class="track"><div class="cap" id="mediaApp">Sin reproducción</div><div class="t" id="mediaTitle">Nada sonando</div><div class="a" id="mediaArtist">Reproduce algo en el PC</div></div>
      <div class="prog"><div class="bar"><i id="mediaBar"></i></div><div class="times"><span id="mediaPos">0:00</span><span id="mediaDur">0:00</span></div></div>
      <div class="controls">
        <button class="cbtn" data-act="prev" aria-label="Anterior"><svg class="i"><use href="#i-prev"/></svg></button>
        <button class="cbtn main" data-act="playpause" aria-label="Reproducir o pausar"><svg class="i"><use id="ppIcon" href="#i-play"/></svg></button>
        <button class="cbtn" data-act="next" aria-label="Siguiente"><svg class="i"><use href="#i-next"/></svg></button>
        <div class="vol">
          <button class="cbtn" id="muteBtn" aria-label="Silenciar"><svg class="i"><use id="volIcon" href="#i-vol"/></svg></button>
          <input type="range" id="vol" min="0" max="100" value="50" aria-label="Volumen">
          <output id="volOut">50</output>
        </div>
      </div>
    </div>

    <div class="tile stat" data-k="cpu" style="--c: var(--teal)"><span class="cap" style="color:var(--teal)">CPU</span><div class="v" id="cpuV">–</div><div class="s" id="cpuS"></div><canvas></canvas></div>
    <div class="tile stat" data-k="ram" style="--c: var(--violet)"><span class="cap" style="color:var(--violet)">RAM</span><div class="v" id="ramV">–</div><div class="s" id="ramS"></div><canvas></canvas></div>
    <div class="tile stat" data-k="net" style="--c: var(--orange)"><span class="cap" style="color:var(--orange)">Red</span><div class="v" id="netV">–</div><div class="s" id="netS"></div><canvas></canvas></div>
    <div class="tile stat" data-k="disk" style="--c: var(--green)"><span class="cap" style="color:var(--green)">Disco</span><div class="v" id="diskV">–</div><div class="s" id="diskS"></div><canvas></canvas></div>
  </section>

  <!-- 2 · Sistema -->
  <section class="page" data-name="Sistema">
    <div class="tile ring" id="ringCpu"></div>
    <div class="tile ring" id="ringRam"></div>
    <div class="tile ring" id="ringD1"></div>
    <div class="tile ring" id="ringD2"></div>
    <div class="deck" id="deck"></div>
  </section>

  <!-- 3 · Comandos -->
  <section class="page" data-name="Comandos">
    <div class="cmds" id="cmds"></div>
    <div class="tile console">
      <div class="head"><span class="cap">Salida</span><span id="consoleMeta"></span></div>
      <pre id="console"><span class="hint">Pulsa un comando para ver aquí su resultado.</span></pre>
    </div>
  </section>
</div>
<nav id="dots"></nav>

<div class="sheet" id="sheet"><div class="box"><h3 id="sheetTitle"></h3><div class="row"><button id="sheetNo">Cancelar</button><button class="go" id="sheetYes">Sí, hacerlo</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  // El token llega en el fragmento (#t=...), que nunca se envía al servidor.
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('t');
  let token = fromHash;
  try { if (fromHash) sessionStorage.setItem('panelToken', fromHash); token = sessionStorage.getItem('panelToken') || fromHash; } catch {}
  if (fromHash) history.replaceState(null, '', location.pathname);

  const $ = (id) => document.getElementById(id);
  const api = async (path, opts = {}) => {
    const r = await fetch(path, { ...opts, headers: { 'x-panel-token': token || '', 'Content-Type': 'application/json' } });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || r.status);
    return body;
  };
  const buzz = () => { try { navigator.vibrate && navigator.vibrate(10); } catch {} };
  const icon = (name) => `<svg class="i"><use href="#i-${/^[a-z]+$/.test(name || '') ? name : 'dot'}"/></svg>`;
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- Páginas
  const pagesEl = $('pages'), pages = [...document.querySelectorAll('.page')], dots = $('dots');
  pages.forEach((p, i) => { const b = document.createElement('button'); b.setAttribute('aria-label', p.dataset.name); b.onclick = () => go(i); dots.appendChild(b); });
  const current = () => Math.round(pagesEl.scrollLeft / pagesEl.clientWidth);
  const go = (i) => pagesEl.scrollTo({ left: Math.max(0, Math.min(pages.length - 1, i)) * pagesEl.clientWidth, behavior: 'smooth' });
  const markDot = () => { const c = current(); [...dots.children].forEach((d, i) => d.classList.toggle('on', i === c)); try { localStorage.setItem('panelPage', c); } catch {} drawSparks(); };
  pagesEl.addEventListener('scroll', () => { clearTimeout(markDot.t); markDot.t = setTimeout(markDot, 60); });
  addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') go(current() + 1); if (e.key === 'ArrowLeft') go(current() - 1); });
  addEventListener('resize', () => { const c = Number(localStorage.getItem('panelPage') || 0); pagesEl.scrollLeft = c * pagesEl.clientWidth; drawSparks(); });
  try { const c = Number(localStorage.getItem('panelPage') || 0); requestAnimationFrame(() => (pagesEl.scrollLeft = c * pagesEl.clientWidth)); } catch {}

  // ---------- Avisos y confirmación
  let tt; const toast = (m) => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); };
  const confirmSheet = (title) => new Promise((res) => {
    $('sheetTitle').textContent = title; $('sheet').classList.add('open');
    const done = (v) => { $('sheet').classList.remove('open'); res(v); };
    $('sheetYes').onclick = () => done(true); $('sheetNo').onclick = () => done(false);
    $('sheet').onclick = (e) => { if (e.target.id === 'sheet') done(false); };
  });

  // ---------- Acciones
  async function run(item, el) {
    buzz();
    if (item.confirm && !(await confirmSheet(`¿${item.label}?`))) return;
    el && (el.classList.remove('ok', 'err'), el.classList.add('busy'));
    if (item.type === 'command') { $('console').innerHTML = `<span class="hint">Ejecutando ${esc(item.label)}…</span>`; $('consoleMeta').textContent = ''; }
    try {
      const r = await api('/api/action', { method: 'POST', body: JSON.stringify({ id: item.id }) });
      el && (el.classList.remove('busy'), el.classList.add(r.code === 0 ? 'ok' : 'err'));
      if (r.showOutput) {
        $('console').innerHTML = (esc(r.stdout) || '<span class="hint">(sin salida)</span>') + (r.stderr ? `\n\n<span class="err">${esc(r.stderr)}</span>` : '');
        $('consoleMeta').textContent = `${item.label} · ${r.ms} ms`;
      } else if (r.code !== 0) toast('Error: ' + (r.stderr || r.code));
    } catch (e) { el && (el.classList.remove('busy'), el.classList.add('err')); toast('Error: ' + e.message); }
    el && setTimeout(() => el.classList.remove('ok', 'err'), 1200);
    setTimeout(tick, 500);
  }
  const keyBtn = (item) => {
    const b = document.createElement('button'); b.className = 'key';
    if (item.color && /^#[0-9a-f]{3,8}$/i.test(item.color)) b.style.setProperty('--c', item.color);
    b.innerHTML = `${icon(item.icon)}<span>${esc(item.label)}</span>`; b.onclick = () => run(item, b); return b;
  };
  let mediaItems = {};
  async function loadConfig() {
    const cfg = await api('/api/config'); document.title = cfg.title;
    const by = (p) => cfg.groups.filter((g) => g.place === p).flatMap((g) => g.items);
    $('deck').replaceChildren(...by('atajos').slice(0, 12).map(keyBtn));
    $('cmds').replaceChildren(...by('comandos').map(keyBtn));
    mediaItems = Object.fromEntries(by('media').map((i) => [i.id, i]));
  }
  document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
    const item = mediaItems[b.dataset.act]; if (!item) return toast('Botón no configurado');
    if (b.dataset.act === 'playpause' && lastMedia) { lastMedia.status = lastMedia.status === 'playing' ? 'paused' : 'playing'; renderMedia(lastMedia, true); }
    run(item, null);
  }));

  // ---------- Volumen
  const vol = $('vol'); let volDragUntil = 0, volMuted = false, volTimer;
  const paintVol = (v) => { vol.value = v; vol.style.setProperty('--p', v + '%'); $('volOut').textContent = v; };
  vol.addEventListener('input', () => {
    volDragUntil = Date.now() + 2500; paintVol(vol.value); $('volIcon').setAttribute('href', '#i-vol');
    clearTimeout(volTimer); volTimer = setTimeout(() => api('/api/volume', { method: 'POST', body: JSON.stringify({ level: Number(vol.value) }) }).catch(() => {}), 80);
  });
  $('muteBtn').onclick = () => { buzz(); volMuted = !volMuted; volDragUntil = Date.now() + 2500; $('volIcon').setAttribute('href', volMuted ? '#i-mute' : '#i-vol');
    api('/api/volume', { method: 'POST', body: JSON.stringify({ muted: volMuted }) }).catch(() => {}); };

  // ---------- Reloj
  const dateFmt = new Intl.DateTimeFormat('es', { weekday: 'long', day: 'numeric', month: 'long' });
  const pad = (n) => String(n).padStart(2, '0');
  function clock() { const d = new Date(); $('hh').textContent = pad(d.getHours()); $('mm').textContent = pad(d.getMinutes()); $('ss').textContent = pad(d.getSeconds()); const t = dateFmt.format(d); $('date').textContent = t.charAt(0).toUpperCase() + t.slice(1); }
  clock(); setInterval(clock, 1000);

  // ---------- Música
  let lastMedia = null, mediaAt = 0, artKey = null;
  const mmss = (s) => { s = Math.max(0, Math.round(s || 0)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return (h ? h + ':' + pad(m) : m) + ':' + pad(s % 60); };
  const appName = (id) => { id = (id || '').toLowerCase();
    for (const [k, v] of [['spotify', 'Spotify'], ['opera', 'Opera'], ['chrome', 'Chrome'], ['msedge', 'Edge'], ['firefox', 'Firefox'], ['zune', 'Reproductor'], ['vlc', 'VLC'], ['music', 'Música']]) if (id.includes(k)) return v;
    return id ? id.split(/[!.\\]/)[0] : 'Reproduciendo'; };
  function renderMedia(m, optimistic) {
    lastMedia = m; if (!optimistic) mediaAt = Date.now();
    if (!m) { $('mediaApp').textContent = 'Sin reproducción'; $('mediaTitle').textContent = 'Nada sonando'; $('mediaArtist').textContent = 'Reproduce algo en el PC';
      $('mediaBar').style.width = '0'; $('mediaPos').textContent = $('mediaDur').textContent = '0:00'; $('ppIcon').setAttribute('href', '#i-play'); setArt(null); return; }
    $('mediaApp').textContent = appName(m.app); $('mediaTitle').textContent = m.title; $('mediaArtist').textContent = m.artist || '';
    $('ppIcon').setAttribute('href', m.status === 'playing' ? '#i-pause' : '#i-play'); progress();
  }
  function progress() {
    const m = lastMedia; if (!m || !m.duration) { $('mediaBar').style.width = '0'; return; }
    const pos = Math.min(m.duration, m.position + (m.status === 'playing' ? (Date.now() - mediaAt) / 1000 : 0));
    $('mediaBar').style.width = (pos / m.duration) * 100 + '%'; $('mediaPos').textContent = mmss(pos); $('mediaDur').textContent = mmss(m.duration);
  }
  setInterval(progress, 1000);
  function setArt(url) { const a = $('art'); a.style.backgroundImage = url ? `url("${url}")` : ''; a.classList.toggle('has', !!url); }
  async function syncArt(key) {
    if (key === artKey) return; artKey = key;
    if (!key) return setArt(null);
    try { const r = await api('/api/art'); if (r.key === key && /^data:image\/[a-z+]+;base64,[A-Za-z0-9+/=]+$/.test(r.data || '')) setArt(r.data); } catch {}
  }

  // ---------- Gráficas
  const hist = { cpu: [], ram: [], net: [], disk: [] };
  const colors = { cpu: '#2dd4bf', ram: '#a78bfa', net: '#fb923c', disk: '#4ade80' };
  function drawSparks() {
    document.querySelectorAll('.stat').forEach((tile) => {
      const k = tile.dataset.k, c = tile.querySelector('canvas'), data = hist[k];
      const w = c.clientWidth, h = c.clientHeight; if (!w || !h) return;
      const dpr = devicePixelRatio || 1; c.width = w * dpr; c.height = h * dpr; const x = c.getContext('2d'); x.scale(dpr, dpr);
      if (data.length < 2) return;
      const max = k === 'net' ? Math.max(...data, 1) * 1.15 : 100, n = 40, step = w / (n - 1);
      const pts = data.map((v, i) => [w - (data.length - 1 - i) * step, h - (v / max) * (h - 3) - 1.5]);
      const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, colors[k] + '40'); g.addColorStop(1, colors[k] + '00');
      x.beginPath(); pts.forEach(([a, b], i) => (i ? x.lineTo(a, b) : x.moveTo(a, b))); x.lineTo(w, h); x.lineTo(pts[0][0], h); x.fillStyle = g; x.fill();
      x.beginPath(); pts.forEach(([a, b], i) => (i ? x.lineTo(a, b) : x.moveTo(a, b))); x.strokeStyle = colors[k]; x.lineWidth = 1.6; x.lineJoin = 'round'; x.stroke();
    });
  }
  const push = (k, v) => { hist[k].push(v); if (hist[k].length > 40) hist[k].shift(); };
  const R = 42, C = 2 * Math.PI * R, ARC = 0.75;
  function ring(el, label, color, pct, value, unit, sub) {
    if (!el.firstChild) el.innerHTML = `<div class="g"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="${R}" stroke-dasharray="${C * ARC} ${C}"/><circle class="arc" cx="50" cy="50" r="${R}" stroke="${color}" stroke-dasharray="${C * ARC} ${C}" stroke-dashoffset="${C * ARC}"/></svg><div class="n"></div></div><div class="cap" style="color:${color}">${esc(label)}</div><div class="s"></div>`;
    el.querySelector('.arc').style.strokeDashoffset = C * ARC * (1 - Math.max(0, Math.min(100, pct)) / 100);
    el.querySelector('.n').innerHTML = `<span>${esc(value)}<small>${esc(unit)}</small></span>`; el.querySelector('.s').textContent = sub;
  }

  // ---------- Datos
  const fmtB = (b, d) => { const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++; } return [b.toFixed(d ?? (b < 10 && i ? 1 : 0)), u[i]]; };
  const fmtUp = (u) => { const d = Math.floor(u / 86400), h = Math.floor((u % 86400) / 3600), m = Math.floor((u % 3600) / 60); return (d ? d + ' d ' : '') + h + ' h ' + m + ' min'; };
  function render(s) {
    $('host').textContent = s.host; $('uptime').textContent = fmtUp(s.uptime); $('cpuModel').textContent = s.cpu.model || '';
    const cpu = s.cpu.percent; push('cpu', cpu);
    $('cpuV').innerHTML = `${Math.round(cpu)}<small>%</small>`; $('cpuS').textContent = `${s.cpu.cores} hilos`;
    const used = s.mem.total - s.mem.free, rp = (used / s.mem.total) * 100; push('ram', rp);
    const [uv, uu] = fmtB(used, 1), [tv, tu] = fmtB(s.mem.total, 0);
    $('ramV').innerHTML = `${uv}<small>${uu}</small>`; $('ramS').textContent = `${Math.round(rp)}% de ${tv} ${tu}`;
    const rx = s.net.rxBps || 0, tx = s.net.txBps || 0; push('net', rx + tx);
    const [rv, ru] = fmtB(rx), [xv, xu] = fmtB(tx);
    $('netV').innerHTML = `${rv}<small>${ru}/s</small>`; $('netS').textContent = `↓ ${rv} ${ru}/s · ↑ ${xv} ${xu}/s`;
    const disks = s.disks || [], d0 = disks[0];
    if (d0) { const p = ((d0.total - d0.free) / d0.total) * 100; push('disk', p); const [fv, fu] = fmtB(d0.free);
      $('diskV').innerHTML = `${Math.round(p)}<small>%</small>`; $('diskS').textContent = `${d0.name} · ${fv} ${fu} libres`; }
    drawSparks();

    ring($('ringCpu'), 'CPU', colors.cpu, cpu, Math.round(cpu), '%', `${s.cpu.cores} hilos`);
    ring($('ringRam'), 'RAM', colors.ram, rp, uv, uu, `de ${tv} ${tu}`);
    [[$('ringD1'), disks[0], colors.disk], [$('ringD2'), disks[1], colors.net]].forEach(([el, d, c]) => {
      el.style.visibility = d ? '' : 'hidden'; if (!d) return;
      const p = ((d.total - d.free) / d.total) * 100, [fv, fu] = fmtB(d.free);
      ring(el, 'Disco ' + d.name, c, p, Math.round(p), '%', `${fv} ${fu} libres`);
    });

    if (s.volume && s.volume.level != null && Date.now() > volDragUntil) {
      volMuted = !!s.volume.muted; paintVol(s.volume.level); $('volIcon').setAttribute('href', volMuted ? '#i-mute' : '#i-vol');
    }
    $('stripVol').textContent = s.volume && s.volume.level != null ? (s.volume.muted ? 'Silencio' : `Vol ${s.volume.level}%`) : 'Vol –';
    renderMedia(s.media); syncArt(s.artKey);
  }

  function online(on, text) { $('live').classList.toggle('on', on); $('stripStatus').textContent = text; }
  let cfgLoaded = false, busy = false;
  async function tick() {
    if (busy) return; busy = true;
    try { if (!cfgLoaded) { await loadConfig(); cfgLoaded = true; } render(await api('/api/stats')); online(true, 'Conectado'); }
    catch (e) { online(false, String(e.message).includes('token') ? 'Token inválido' : 'Sin conexión'); }
    busy = false;
  }
  if (!token) online(false, 'Falta el token');
  markDot();
  tick(); setInterval(tick, 1500);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
})();
</script>
</body>
</html>
